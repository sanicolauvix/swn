<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis SWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080808;
      --bg-card:  #111111;
      --bg-ch:    #181818;
      --border:   #1C1C1C;
      --border-h: #282828;
      --gold:     #C9A96E;
      --gold-l:   #E8D5AA;
      --gold-d:   #7A5A20;
      --text:     #EEEAE4;
      --text-s:   #8A847A;
      --text-d:   #4A4540;
      --green:    #4CAF50;
      --red:      #E53935;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ────────────────────── HEADER ────────────────────── */
    header {
      position: relative;
      text-align: center;
      padding: 90px 24px 70px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,169,110,0.13) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 28px;
    }
    .logo-letters {
      font-family: 'Playfair Display', serif;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 16px;
      color: var(--gold);
      text-indent: 16px;
      line-height: 1;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--text-d);
      margin-top: 6px;
      text-indent: 5px;
    }
    .logo-divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 28px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(30px, 5vw, 56px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    header p {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-s);
      font-weight: 400;
    }

    /* ────────────────────── MAIN ────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }

    /* ────────────────────── BUILDING ────────────────────── */
    .edificio {
      margin-bottom: 80px;
    }
    .edificio-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .edificio-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-h), transparent);
    }
    .edificio-icon {
      color: var(--gold-d);
      font-size: 18px;
      line-height: 1;
    }
    .edificio-nome {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ────────────────────── GRID ────────────────────── */
    .apto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ────────────────────── CARD ────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .3s, transform .3s, box-shadow .3s;
      position: relative;
    }
    .card:hover {
      border-color: var(--border-h);
      transform: translateY(-4px);
      box-shadow: 0 24px 64px rgba(0,0,0,.45), 0 0 0 1px rgba(201,169,110,.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 24px 22px 18px;
      border-bottom: 1px solid var(--border);
    }
    .apto-num {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .apto-label {
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-d);
      margin-top: 5px;
    }

    /* ────────────────────── BADGE ────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-livre {
      background: rgba(76,175,80,.12);
      color: #66BB6A;
      border: 1px solid rgba(76,175,80,.25);
    }
    .badge-ocupado {
      background: rgba(229,57,53,.1);
      color: #EF5350;
      border: 1px solid rgba(229,57,53,.22);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .badge-livre .dot {
      background: #66BB6A;
      box-shadow: 0 0 6px rgba(102,187,106,.8);
      animation: blink 2s ease-in-out infinite;
    }
    .badge-ocupado .dot { background: #EF5350; }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    /* ────────────────────── CARD BODY ────────────────────── */
    .card-body { padding: 18px 20px 22px; }

    /* ────────────────────── MEDIA GRID ────────────────────── */
    .media-grid {
      display: grid;
      gap: 6px;
    }
    .g1 { grid-template-columns: 1fr; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr; }
    .g3 .mi:first-child { grid-column: 1 / -1; }
    .g4 { grid-template-columns: 1fr 1fr; }

    .mi {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: zoom-in;
      background: var(--border);
      aspect-ratio: 16 / 9;
    }
    .mi.video-thumb { cursor: pointer; }
    .mi img, .mi video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .45s ease;
    }
    .mi:hover img, .mi:hover video { transform: scale(1.06); }

    .mi-ov {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.35);
      opacity: 0;
      transition: opacity .3s;
    }
    .mi:hover .mi-ov { opacity: 1; }

    .play-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(201,169,110,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .play-btn svg { width: 22px; height: 22px; fill: #000; margin-left: 4px; }

    .expand-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .expand-btn svg {
      width: 18px; height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    .more-badge {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      backdrop-filter: blur(2px);
    }

    /* ────────────────────── SEM MÍDIA ────────────────────── */
    .sem-midia {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 36px 24px;
      border: 1px dashed var(--border-h);
      border-radius: 10px;
      text-align: center;
      color: var(--text-d);
    }
    .sem-midia svg { width: 28px; height: 28px; opacity: .35; }
    .sem-midia p { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

    /* ────────────────────── OCUPADO ────────────────────── */
    .ocupado-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 44px 24px;
      border-radius: 10px;
      border: 1px solid rgba(229,57,53,.18);
      background: repeating-linear-gradient(
        -45deg,
        rgba(229,57,53,.04)  0px,
        rgba(229,57,53,.04)  8px,
        transparent          8px,
        transparent          18px
      );
      text-align: center;
    }
    .ocupado-lock {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(229,57,53,.12);
      border: 1px solid rgba(229,57,53,.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ocupado-lock svg {
      width: 22px; height: 22px;
      fill: none;
      stroke: #EF5350;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .ocupado-txt {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-s);
    }

    /* ────────────────────── LIGHTBOX ────────────────────── */
    #lb {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.96);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    #lb.open {
      opacity: 1;
      pointer-events: all;
    }
    #lb-content {
      max-width: min(92vw, 1100px);
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #lb-content img, #lb-content video {
      max-width: 100%;
      max-height: 88vh;
      border-radius: 10px;
      object-fit: contain;
      box-shadow: 0 32px 96px rgba(0,0,0,.7);
    }
    .lb-btn {
      position: fixed;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s;
    }
    .lb-btn:hover { background: rgba(201,169,110,.18); border-color: rgba(201,169,110,.3); }
    #lb-close {
      top: 18px; right: 18px;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 22px;
    }
    #lb-prev, #lb-next {
      top: 50%; transform: translateY(-50%);
      width: 48px; height: 72px;
      border-radius: 8px;
      font-size: 26px;
    }
    #lb-prev { left: 14px; }
    #lb-next { right: 14px; }
    #lb-counter {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--text-s);
    }

    /* ────────────────────── LOADING ────────────────────── */
    .loading {
      text-align: center;
      padding: 96px 24px;
      color: var(--text-d);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%  { content: '.'   }
      33% { content: '..'  }
      66% { content: '...' }
    }

    /* ────────────────────── STATS BAR ────────────────────── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 32px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-s);
      margin-top: 6px;
    }

    /* ────────────────────── FOOTER ────────────────────── */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-d);
      font-size: 12px;
      letter-spacing: 1px;
    }
    footer span { color: var(--gold-d); }

    /* ────────────────────── RESPONSIVE ────────────────────── */
    @media (max-width: 640px) {
      header { padding: 60px 20px 48px; }
      .logo-letters { font-size: 40px; letter-spacing: 10px; }
      .apto-grid { grid-template-columns: 1fr; }
      .stats { gap: 28px; }
      .stat-num { font-size: 28px; }
      #lb-prev, #lb-next { display: none; }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo-wrap">
    <div class="logo-letters">SWN</div>
    <div class="logo-sub">Imóveis</div>
  </div>
  <div class="logo-divider"></div>
  <h1>Imóveis SWN</h1>
  <p>Exclusividade &amp; Conforto</p>
</header>

<!-- STATS -->
<div id="stats-bar" class="stats" style="display:none">
  <div class="stat">
    <div class="stat-num" id="st-total">—</div>
    <div class="stat-label">Apartamentos</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="st-livre" style="color:#66BB6A">—</div>
    <div class="stat-label">Disponíveis</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="st-ocup" style="color:#EF5350">—</div>
    <div class="stat-label">Ocupados</div>
  </div>
</div>

<!-- APP -->
<main id="app"><div class="loading">Carregando imóveis</div></main>

<!-- LIGHTBOX -->
<div id="lb">
  <div id="lb-content"></div>
  <button class="lb-btn" id="lb-close" onclick="lbClose()">✕</button>
  <button class="lb-btn" id="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <button class="lb-btn" id="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 <span>SWN Imóveis</span> &nbsp;·&nbsp; Todos os direitos reservados</p>
</footer>

<script>
/* ── LIGHTBOX ── */
let _LB = { items: [], idx: 0 };

function lbOpen(storeKey, idx) {
  _LB.items = window._store[storeKey] || [];
  _LB.idx   = idx;
  _render();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function lbClose() {
  const v = document.querySelector('#lb-content video');
  if (v) v.pause();
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('lb-content').innerHTML = '';
}
function lbNav(d) {
  const v = document.querySelector('#lb-content video');
  if (v) v.pause();
  _LB.idx = (_LB.idx + d + _LB.items.length) % _LB.items.length;
  _render();
}
function _render() {
  const item = _LB.items[_LB.idx];
  const c    = document.getElementById('lb-content');
  if (item.tipo === 'video') {
    c.innerHTML = `<video src="${item.src}" controls autoplay></video>`;
  } else {
    c.innerHTML = `<img src="${item.src}" alt="Foto do apartamento">`;
  }
  const total = _LB.items.length;
  document.getElementById('lb-counter').textContent =
    total > 1 ? `${_LB.idx + 1} / ${total}` : '';
  const show = total > 1;
  document.getElementById('lb-prev').style.display = show ? '' : 'none';
  document.getElementById('lb-next').style.display = show ? '' : 'none';
}
document.getElementById('lb').addEventListener('click', function(e) {
  if (e.target === this) lbClose();
});
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape')      lbClose();
  if (e.key === 'ArrowLeft')   lbNav(-1);
  if (e.key === 'ArrowRight')  lbNav(1);
});

/* ── GLOBAL STORE ── */
window._store = {};

/* ── SVGs ── */
const SVG_PHOTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
  <rect x="3" y="3" width="18" height="18" rx="3"/>
  <circle cx="8.5" cy="8.5" r="1.5"/>
  <path d="M21 15l-5-5L5 21"/>
</svg>`;
const SVG_LOCK = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
  <rect x="5" y="11" width="14" height="10" rx="2"/>
  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
</svg>`;
const SVG_EXPAND = `<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_PLAY  = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;

/* ── CARD RENDER ── */
function buildCard(edifSlug, apto) {
  const livre    = apto.status === 'livre';
  const key      = `${edifSlug}__${apto.numero}`;
  window._store[key] = apto.midia || [];

  const badgeHtml = livre
    ? `<span class="badge badge-livre"><span class="dot"></span>Disponível</span>`
    : `<span class="badge badge-ocupado"><span class="dot"></span>Ocupado</span>`;

  let bodyHtml = '';

  if (!livre) {
    bodyHtml = `
      <div class="ocupado-box">
        <div class="ocupado-lock">${SVG_LOCK}</div>
        <p class="ocupado-txt">Este apartamento está ocupado</p>
      </div>`;

  } else if (!apto.midia || apto.midia.length === 0) {
    bodyHtml = `
      <div class="sem-midia">
        ${SVG_PHOTO}
        <p>Fotos em breve</p>
      </div>`;

  } else {
    const items = apto.midia;
    const n     = items.length;
    const shown = Math.min(n, 4);
    const gClass = n === 1 ? 'g1' : n === 2 ? 'g2' : n === 3 ? 'g3' : 'g4';

    let thumbs = '';
    for (let i = 0; i < shown; i++) {
      const m      = items[i];
      const isVid  = m.tipo === 'video';
      const isLast = i === shown - 1 && n > shown;
      const extra  = n - shown;

      let inner = '';
      if (isVid) {
        inner = `
          <video src="${m.src}" muted preload="metadata"></video>
          <div class="mi-ov">
            <div class="play-btn">${SVG_PLAY}</div>
          </div>`;
      } else {
        inner = `
          <img src="${m.src}" alt="Foto" loading="lazy">
          <div class="mi-ov">
            <div class="expand-btn">${SVG_EXPAND}</div>
          </div>`;
      }
      if (isLast) {
        inner += `<div class="more-badge">+${extra + 1}</div>`;
      }

      const miClass = isVid ? 'mi video-thumb' : 'mi';
      thumbs += `<div class="${miClass}" data-key="${key}" data-idx="${i}">${inner}</div>`;
    }

    bodyHtml = `<div class="media-grid ${gClass}">${thumbs}</div>`;
  }

  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="apto-num">${apto.numero}</div>
          <div class="apto-label">Apartamento</div>
        </div>
        ${badgeHtml}
      </div>
      <div class="card-body">${bodyHtml}</div>
    </div>`;
}

/* ── CLICK DELEGATION ── */
document.getElementById('app').addEventListener('click', function(e) {
  const mi = e.target.closest('.mi');
  if (!mi) return;
  lbOpen(mi.dataset.key, parseInt(mi.dataset.idx));
});

/* ── STATS ── */
function updateStats(edificios) {
  let total = 0, livre = 0, ocup = 0;
  for (const e of edificios) {
    for (const a of e.apartamentos) {
      total++;
      if (a.status === 'livre') livre++; else ocup++;
    }
  }
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-livre').textContent = livre;
  document.getElementById('st-ocup').textContent  = ocup;
  document.getElementById('stats-bar').style.display = '';
}

/* ── FETCH & RENDER ── */
fetch('data.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => {
    const app  = document.getElementById('app');
    const edifs = data.edificios || [];

    if (!edifs.length) {
      app.innerHTML = '<p style="text-align:center;padding:80px;color:#555;letter-spacing:2px;font-size:12px;text-transform:uppercase">Nenhum imóvel cadastrado</p>';
      return;
    }

    updateStats(edifs);

    app.innerHTML = edifs.map(edif => {
      const cards = edif.apartamentos
        .map(a => buildCard(edif.slug, a))
        .join('');
      return `
        <section class="edificio">
          <div class="edificio-header">
            <div class="edificio-nome">${edif.nome}</div>
          </div>
          <div class="apto-grid">${cards}</div>
        </section>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('app').innerHTML =
      '<p style="text-align:center;padding:80px;color:#555;letter-spacing:2px;font-size:12px;text-transform:uppercase">Erro ao carregar dados</p>';
  });
</script>

</body>
</html>
