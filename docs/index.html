<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis SWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080808;
      --bg-card:  #111111;
      --bg-ch:    #181818;
      --border:   #1C1C1C;
      --border-h: #282828;
      --gold:     #C9A96E;
      --gold-l:   #E8D5AA;
      --gold-d:   #7A5A20;
      --text:     #EEEAE4;
      --text-s:   #8A847A;
      --text-d:   #4A4540;
      --green:    #4CAF50;
      --red:      #E53935;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,.92);
      backdrop-filter: blur(12px);
    }
    .header-logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .header-imoveis {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-s);
    }
    .header-swn {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 7px;
      color: var(--gold);
      text-indent: 7px;
      line-height: 1;
    }

    /* ── MAIN ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-d);
      margin-bottom: 28px;
    }

    /* ── BUILDING CARDS GRID ── */
    .edif-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* ── BUILDING CARD ── */
    .edif-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-card);
      overflow: hidden;
      cursor: default;
      transition: border-color .3s, box-shadow .3s;
    }
    .edif-card:hover {
      border-color: var(--border-h);
      box-shadow: 0 28px 72px rgba(0,0,0,.5), 0 0 0 1px rgba(201,169,110,.07);
    }

    /* capa do edifício */
    .edif-capa {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--border);
      overflow: hidden;
      cursor: pointer;
    }
    .edif-capa img, .edif-capa video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }
    .edif-capa:hover img,
    .edif-capa:hover video { transform: scale(1.04); }
    .edif-capa-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .3s;
      background: rgba(0,0,0,.2);
    }
    .edif-capa:hover .edif-capa-play { opacity: 1; }
    .edif-capa-play svg {
      width: 60px; height: 60px;
      fill: rgba(255,255,255,.88);
      filter: drop-shadow(0 2px 12px rgba(0,0,0,.6));
    }

    .edif-capa-vazia {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .edif-capa-vazia svg {
      width: 40px; height: 40px;
      fill: none;
      stroke: var(--border-h);
      stroke-width: 1.5;
    }

    /* badge de disponibilidade sobre a capa */
    .edif-avail-badge {
      position: absolute;
      top: 14px; right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
    }
    .edif-avail-badge.tem-livre {
      background: rgba(10,10,10,.65);
      border: 1px solid rgba(76,175,80,.35);
      color: #66BB6A;
    }
    .edif-avail-badge.tudo-ocup {
      background: rgba(10,10,10,.65);
      border: 1px solid rgba(229,57,53,.3);
      color: #EF5350;
    }
    .avail-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .tem-livre .avail-dot {
      background: #66BB6A;
      animation: blink 2s ease-in-out infinite;
    }
    .tudo-ocup .avail-dot { background: #EF5350; }

    /* rodapé do card do edifício */
    .edif-info {
      padding: 20px 22px 22px;
    }
    .edif-nome {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .edif-dispon {
      font-size: 12px;
      color: var(--text-s);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .edif-dispon-num {
      color: var(--gold);
      font-weight: 600;
    }
    .edif-ver-mais {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-d);
      transition: color .2s;
      cursor: pointer;
    }
    .edif-ver-mais:hover { color: var(--gold); }
    .edif-ver-mais svg {
      width: 14px; height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      transition: transform .2s;
    }
    .edif-ver-mais:hover svg { transform: translateX(4px); }

    /* ── BACK BUTTON ── */
    .back-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-h);
      background: none;
      color: var(--text-s);
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-back:hover { border-color: var(--gold-d); color: var(--gold); }
    .btn-back svg {
      width: 14px; height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .back-edif-nome {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-s);
    }

    /* ── APARTMENT GRID ── */
    .apto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── APARTMENT CARD ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .card:hover {
      border-color: var(--border-h);
      transform: translateY(-4px);
      box-shadow: 0 24px 64px rgba(0,0,0,.45), 0 0 0 1px rgba(201,169,110,.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--border);
    }
    .apto-num {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .apto-label {
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-d);
      margin-top: 5px;
    }

    /* badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge-livre {
      background: rgba(76,175,80,.12);
      color: #66BB6A;
      border: 1px solid rgba(76,175,80,.25);
    }
    .badge-ocupado {
      background: rgba(229,57,53,.1);
      color: #EF5350;
      border: 1px solid rgba(229,57,53,.22);
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .badge-livre .dot {
      background: #66BB6A;
      box-shadow: 0 0 6px rgba(102,187,106,.8);
      animation: blink 2s ease-in-out infinite;
    }
    .badge-ocupado .dot { background: #EF5350; }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: .3; }
    }

    /* valor */
    .card-valor-wrap {
      padding: 16px 22px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .card-valor {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .card-valor-mes {
      font-size: 11px;
      color: var(--text-s);
      letter-spacing: 1px;
    }

    /* características do imóvel */
    .caracteristicas {
      padding: 14px 22px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .carac-linha {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      font-weight: 400;
    }
    .carac-linha svg {
      width: 14px; height: 14px;
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.8;
      stroke-linecap: round;
      flex-shrink: 0;
      opacity: .8;
    }

    /* condições */
    .condicoes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 22px 0;
    }
    .cond-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-s);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border-h);
    }
    .cond-chip svg {
      width: 10px; height: 10px;
      fill: none;
      stroke: var(--gold-d);
      stroke-width: 2.5;
      stroke-linecap: round;
      flex-shrink: 0;
    }

    /* card body (media) */
    .card-body { padding: 16px 18px 20px; }

    /* media grid */
    .media-grid { display: grid; gap: 6px; }
    .g1 { grid-template-columns: 1fr; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr; }
    .g3 .mi:first-child { grid-column: 1 / -1; }
    .g4 { grid-template-columns: 1fr 1fr; }

    .mi {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: zoom-in;
      background: var(--border);
      aspect-ratio: 16/9;
    }
    .mi.video-thumb { cursor: pointer; }
    .mi img, .mi video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .45s ease;
    }
    .mi:hover img, .mi:hover video { transform: scale(1.06); }
    .mi-ov {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.35);
      opacity: 0; transition: opacity .3s;
    }
    .mi:hover .mi-ov { opacity: 1; }
    .play-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(201,169,110,.88);
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn svg { width: 20px; height: 20px; fill: #000; margin-left: 4px; }
    .expand-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
    }
    .expand-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; }
    .more-badge {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      backdrop-filter: blur(2px);
    }

    /* sem mídia */
    .sem-midia {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      padding: 32px 24px;
      border: 1px dashed var(--border-h); border-radius: 10px;
      text-align: center; color: var(--text-d);
    }
    .sem-midia svg { width: 26px; height: 26px; opacity: .3; }
    .sem-midia p { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

    /* ocupado */
    .ocupado-box {
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      padding: 40px 24px;
      border-radius: 10px;
      border: 1px solid rgba(229,57,53,.18);
      background: repeating-linear-gradient(
        -45deg, rgba(229,57,53,.04) 0px, rgba(229,57,53,.04) 8px,
        transparent 8px, transparent 18px);
      text-align: center;
    }
    .ocupado-lock {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(229,57,53,.12); border: 1px solid rgba(229,57,53,.25);
      display: flex; align-items: center; justify-content: center;
    }
    .ocupado-lock svg {
      width: 20px; height: 20px;
      fill: none; stroke: #EF5350; stroke-width: 2; stroke-linecap: round;
    }
    .ocupado-txt {
      font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-s);
    }

    /* ── LIGHTBOX ── */
    #lb {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.96);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #lb.open { opacity: 1; pointer-events: all; }
    #lb-content {
      width: min(92vw, 1100px);
      max-height: 88vh;
      display: flex; align-items: center; justify-content: center;
    }
    #lb-content img {
      max-width: 100%; max-height: 88vh;
      border-radius: 10px; object-fit: contain;
      box-shadow: 0 32px 96px rgba(0,0,0,.7);
    }
    #lb-content video {
      width: 100%; max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 32px 96px rgba(0,0,0,.7);
      background: #000;
    }
    .lb-btn {
      position: fixed;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-btn:hover { background: rgba(201,169,110,.18); }
    #lb-close { top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; }
    #lb-prev, #lb-next {
      top: 50%; transform: translateY(-50%);
      width: 48px; height: 72px; border-radius: 8px; font-size: 26px;
    }
    #lb-prev { left: 14px; }
    #lb-next { right: 14px; }
    #lb-counter {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 12px; letter-spacing: 2px; color: var(--text-s);
    }

    /* ── LOADING ── */
    .loading {
      text-align: center; padding: 96px 24px;
      color: var(--text-d); font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 28px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-d); font-size: 11px; letter-spacing: 1px;
    }
    footer span { color: var(--gold-d); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      header { padding: 16px 20px; }
      .edif-grid, .apto-grid { grid-template-columns: 1fr; }
      #lb-prev, #lb-next { display: none; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-logo">
    <span class="header-imoveis">Imóveis</span>
    <span class="header-swn">SWN</span>
  </div>
</header>

<main id="app">
  <div class="loading">Carregando</div>
</main>

<!-- LIGHTBOX -->
<div id="lb">
  <div id="lb-content"></div>
  <button class="lb-btn" id="lb-close" onclick="lbClose()">✕</button>
  <button class="lb-btn" id="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <button class="lb-btn" id="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<footer>
  <p>© 2026 <span>SWN Imóveis</span> · Todos os direitos reservados</p>
</footer>

<script>
/* ── SVGs ── */
const SVG_CHECK  = `<svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>`;
const SVG_BED    = `<svg viewBox="0 0 24 24"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M2 14h20M7 14V9a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v5"/></svg>`;
const SVG_SOFA   = `<svg viewBox="0 0 24 24"><path d="M20 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M2 11a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5H2z"/><path d="M4 18v2M20 18v2M4 16h16"/></svg>`;
const SVG_FORK   = `<svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>`;
const SVG_SHOWER = `<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0Z"/><path d="M4 12h16M12 12v8M8 20h8"/></svg>`;
const SVG_TREE   = `<svg viewBox="0 0 24 24"><path d="M12 22v-7M9.5 15h5M5 9l7-7 7 7H5z"/><path d="M5 15l7-7 7 7H5z"/></svg>`;
const SVG_CAR    = `<svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2v-4l2-5h14l2 5v4a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`;
const SVG_USERS  = `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

function _iconCarac(texto) {
  const t = texto.toLowerCase();
  if (t.includes("quarto") || t.includes("suite") || t.includes("suíte")) return SVG_BED;
  if (t.includes("sala"))      return SVG_SOFA;
  if (t.includes("cozinha"))   return SVG_FORK;
  if (t.includes("banheiro"))  return SVG_SHOWER;
  if (t.includes("varanda"))   return SVG_TREE;
  if (t.includes("garagem"))   return SVG_CAR;
  if (t.includes("area") || t.includes("área")) return SVG_USERS;
  return SVG_CHECK;
}
const SVG_LOCK   = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const SVG_PLAY   = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;
const SVG_EXPAND = `<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_PHOTO  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
const SVG_BACK   = `<svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>`;
const SVG_ARROW  = `<svg viewBox="0 0 24 24"><polyline points="9,6 15,12 9,18"/></svg>`;
const SVG_BUILD  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="20" height="18" rx="1"/><path d="M8 21V8M16 21V8M2 12h20"/></svg>`;

/* ── LIGHTBOX ── */
let _LB = { items: [], idx: 0 };
window._store = {};

function lbOpen(key, idx) {
  _LB.items = window._store[key] || []; _LB.idx = idx;
  _render(); document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function lbClose() {
  const v = document.querySelector('#lb-content video');
  if (v) v.pause();
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('lb-content').innerHTML = '';
}
function lbNav(d) {
  const v = document.querySelector('#lb-content video');
  if (v) v.pause();
  _LB.idx = (_LB.idx + d + _LB.items.length) % _LB.items.length;
  _render();
}
function _render() {
  const item = _LB.items[_LB.idx];
  const c = document.getElementById('lb-content');
  if (item.tipo === 'video') {
    c.innerHTML = `<video src="${item.src}" controls playsinline></video>`;
    const v = c.querySelector('video');
    v.play().catch(() => {});
  } else {
    c.innerHTML = `<img src="${item.src}" alt="Foto">`;
  }
  const total = _LB.items.length;
  document.getElementById('lb-counter').textContent = total > 1 ? `${_LB.idx+1} / ${total}` : '';
  document.getElementById('lb-prev').style.display = total > 1 ? '' : 'none';
  document.getElementById('lb-next').style.display = total > 1 ? '' : 'none';
}
document.getElementById('lb').addEventListener('click', e => { if (e.target === document.getElementById('lb')) lbClose(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

/* ── MEDIA THUMBS (shared) ── */
function buildMediaHtml(key, items) {
  if (!items || !items.length) return '';
  const n = items.length;
  const shown = Math.min(n, 4);
  const gClass = n===1?'g1': n===2?'g2': n===3?'g3':'g4';
  let thumbs = '';
  for (let i = 0; i < shown; i++) {
    const m = items[i]; const isVid = m.tipo === 'video';
    const isLast = i === shown-1 && n > shown;
    let inner = isVid
      ? `<video src="${m.src}" muted preload="metadata"></video><div class="mi-ov"><div class="play-btn">${SVG_PLAY}</div></div>`
      : `<img src="${m.src}" alt="Foto" loading="lazy"><div class="mi-ov"><div class="expand-btn">${SVG_EXPAND}</div></div>`;
    if (isLast) inner += `<div class="more-badge">+${n-shown+1}</div>`;
    thumbs += `<div class="${isVid?'mi video-thumb':'mi'}" data-key="${key}" data-idx="${i}">${inner}</div>`;
  }
  return `<div class="media-grid ${gClass}">${thumbs}</div>`;
}

/* ── NÍVEL 1: CARD DO EDIFÍCIO ── */
function buildEdifCard(edif) {
  const total  = edif.apartamentos.length;
  const livres = edif.apartamentos.filter(a => a.status === 'livre').length;
  const temLivre = livres > 0;
  const storeKey = `edif__${edif.slug}`;
  window._store[storeKey] = edif.midia || [];

  // capa: prefere video; fallback para foto ou placeholder
  let capaHtml = '';
  if (edif.midia && edif.midia.length) {
    const m = edif.midia.find(x => x.tipo === 'video') || edif.midia[0];
    capaHtml = m.tipo === 'video'
      ? `<video src="${m.src}" muted loop autoplay playsinline></video>`
      : `<img src="${m.src}" alt="${edif.nome}">`;
  } else {
    capaHtml = `<div class="edif-capa-vazia">${SVG_BUILD}</div>`;
  }

  const badgeClass = temLivre ? 'tem-livre' : 'tudo-ocup';
  const badgeText  = temLivre
    ? `${livres} disponível${livres > 1 ? 'is' : ''}`
    : 'Todos ocupados';

  const disponHtml = temLivre
    ? `<span class="edif-dispon-num">${livres}</span> apartamento${livres>1?'s':''} disponível${livres>1?'is':''} de ${total}`
    : `Nenhum apartamento disponível`;

  const temMidia = edif.midia && edif.midia.length > 0;
  return `
    <div class="edif-card">
      <div class="edif-capa" data-key="${storeKey}" data-idx="0">
        ${capaHtml}
        ${temMidia ? `<div class="edif-capa-play">${SVG_PLAY}</div>` : ''}
        <div class="edif-avail-badge ${badgeClass}">
          <span class="avail-dot"></span>${badgeText}
        </div>
      </div>
      <div class="edif-info">
        <div class="edif-nome">${edif.nome}</div>
        <div class="edif-dispon">${disponHtml}</div>
        <div class="edif-ver-mais" data-slug="${edif.slug}">Ver apartamentos ${SVG_ARROW}</div>
      </div>
    </div>`;
}

/* ── NÍVEL 2: CARD DO APARTAMENTO ── */
function buildAptoCard(edifSlug, apto) {
  const livre = apto.status === 'livre';
  const key = `${edifSlug}__${apto.numero}`;
  window._store[key] = apto.midia || [];

  const badgeHtml = livre
    ? `<span class="badge badge-livre"><span class="dot"></span>Disponível</span>`
    : `<span class="badge badge-ocupado"><span class="dot"></span>Ocupado</span>`;

  const valorHtml = (livre && apto.valor) ? `
    <div class="card-valor-wrap">
      <span class="card-valor">${apto.valor}</span>
      <span class="card-valor-mes">/ mês</span>
    </div>` : '';

  const caracHtml = (livre && apto.caracteristicas && apto.caracteristicas.length) ? `
    <div class="caracteristicas">
      ${apto.caracteristicas.map(c => `<div class="carac-linha">${_iconCarac(c)}<span>${c}</span></div>`).join('')}
    </div>` : '';

  const condicoesHtml = (livre && apto.condicoes && apto.condicoes.length) ? `
    <div class="condicoes">
      ${apto.condicoes.map(c => `<span class="cond-chip">${SVG_CHECK}${c}</span>`).join('')}
    </div>` : '';

  let bodyHtml = '';
  if (!livre) {
    bodyHtml = `<div class="ocupado-box"><div class="ocupado-lock">${SVG_LOCK}</div><p class="ocupado-txt">Apartamento ocupado</p></div>`;
  } else if (!apto.midia || !apto.midia.length) {
    bodyHtml = `<div class="sem-midia">${SVG_PHOTO}<p>Fotos em breve</p></div>`;
  } else {
    bodyHtml = buildMediaHtml(key, apto.midia);
  }

  return `
    <div class="card">
      <div class="card-top">
        <div><div class="apto-num">${apto.numero}</div><div class="apto-label">Apartamento</div></div>
        ${badgeHtml}
      </div>
      ${valorHtml}
      ${caracHtml}
      ${condicoesHtml}
      <div class="card-body">${bodyHtml}</div>
    </div>`;
}

/* ── NAVEGAÇÃO ── */
let _dados = null;

function mostrarHome() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="section-title">Nossos imóveis</p>
    <div class="edif-grid">
      ${_dados.edificios.map(buildEdifCard).join('')}
    </div>`;
}

function mostrarEdificio(slug) {
  const edif = _dados.edificios.find(e => e.slug === slug);
  if (!edif) return;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="back-row">
      <button class="btn-back" onclick="mostrarHome()">${SVG_BACK} Imóveis</button>
      <span class="back-edif-nome">${edif.nome}</span>
    </div>
    <div class="apto-grid">
      ${edif.apartamentos.map(a => buildAptoCard(edif.slug, a)).join('')}
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── CLICK DELEGATION ── */
document.getElementById('app').addEventListener('click', function(e) {
  // clique na capa do edifício → lightbox com video/foto do prédio
  const edifCapa = e.target.closest('.edif-capa[data-key]');
  if (edifCapa) {
    const key = edifCapa.dataset.key;
    if (window._store[key] && window._store[key].length) {
      lbOpen(key, 0); return;
    }
  }
  // clique em "Ver apartamentos" → navega
  const verMais = e.target.closest('.edif-ver-mais[data-slug]');
  if (verMais) { mostrarEdificio(verMais.dataset.slug); return; }
  // clique em mídia de apartamento → lightbox
  const mi = e.target.closest('.mi');
  if (mi) { lbOpen(mi.dataset.key, parseInt(mi.dataset.idx)); return; }
});

/* ── INIT ── */
fetch('data.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => {
    _dados = data;
    mostrarHome();
  })
  .catch(() => {
    document.getElementById('app').innerHTML =
      '<p style="text-align:center;padding:80px;color:#555;font-size:11px;letter-spacing:3px;text-transform:uppercase">Erro ao carregar dados</p>';
  });
</script>
